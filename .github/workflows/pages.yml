# เผยแพร่เฉพาะไฟล์หน้าเว็บขึ้น GitHub Pages (ไม่รวมโฟลเดอร์ server/)
name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect web files
        run: |
          mkdir -p _site
          cp index.html app.js library.js changelog.js favicon.svg .nojekyll _site/
          cp -r vendor assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
